name: Build and deploy (No LFS Version)

run-name: "No LFS Build Deploy - ${{ github.event_name }}"

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [blog-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Delete default content/post
        run: rm -rf content/post

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ===== 修正：使用 Release Downloader 获取 Dart Sass 二进制 =====
      - name: Install Dart Sass
        uses: robinraju/release-downloader@v1
        with:
          repository: "sass/dart-sass"
          latest: true
          filename: "dart-sass-*-linux-x64.tar.gz"
          tarBall: false
          zipBall: false
          extract: true

      - name: Add Dart Sass to PATH
        run: echo "$(pwd)/dart-sass" >> $GITHUB_PATH
        shell: bash

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Clone private blog posts (No LFS)
        uses: actions/checkout@v6
        with:
          repository: ynhugo/blogs
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: blogs
          lfs: false

      - name: Copy blog content
        run: cp -a blogs/content ./content

      - name: Show content
        run: ls -la content/post

      - name: Run blogs/autoconfig.sh
        run: |
          chmod +x blogs/autoconfig.sh
          bash blogs/autoconfig.sh

      - name: Inject giscus config
        run: |
          sed -i '/^\[comments\]/,/^$/d' config/_default/params.toml
          if [ -f "blogs/giscus.toml" ]; then
            cat blogs/giscus.toml >> config/_default/params.toml
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Build
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
